name: HAWELI Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP if Uploaded from Phone
        run: |
          if [ -f "HAWELI_Complete_Android_Project.zip" ]; then
            unzip -o HAWELI_Complete_Android_Project.zip
          elif ls *.zip 1> /dev/null 2>&1; then
            for z in *.zip; do unzip -o "$z"; done
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Fix Keystore Folder Permissions
        run: |
          sudo chmod -R a+rwX "$ANDROID_HOME"
          mkdir -p "$HOME/.android" "$HOME/.config/.android"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          sudo chown -R "$USER:$USER" "$HOME/.android" "$HOME/.config"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build HAWELI Debug APK
        run: |
          if [ -d "HAWELI" ] && [ -f "HAWELI/settings.gradle.kts" ]; then
            cd HAWELI
          fi
          gradle wrapper --gradle-version 8.6
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAWELI-app-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
